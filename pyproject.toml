[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyd-decompiler"
version = "1.0.0"
description = "Analyze and decompile Python .pyd extension modules"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pefile>=2023.2.7",
    "decompyle3>=3.9.0",
    "uncompyle6>=3.9.0",
]

[project.scripts]
pyd-decompiler = "pyd_decompiler.cli:main"

[tool.setuptools.packages.find]
include = ["pyd_decompiler*"]
